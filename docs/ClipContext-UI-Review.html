<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClipContext · UI 验收画板</title>
  <style>
    :root { color-scheme: light; --paper: #f3f4f6; --ink: #182031; --muted: #515c70; --line: #d9dee7; --accent: #2852a8; --plate: #e9ecf2; }
    * { box-sizing: border-box; }
    html { scroll-padding-top: 20px; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
    a { color: var(--accent); }
    .layout { max-width: 1690px; margin: auto; padding: 40px clamp(16px, 3vw, 48px) 70px; }
    .intro { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 30px; align-items: end; padding: 0 0 24px; border-bottom: 1px solid var(--line); }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(27px, 4vw, 43px); letter-spacing: -.05em; line-height: 1.2; }
    .intro p { margin-top: 9px; color: var(--muted); }
    .legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
    .tag { display: inline-flex; align-items: center; border-radius: 20px; padding: 3px 9px; background: #edf0f5; color: #4a5464; font-size: 11px; white-space: nowrap; line-height: 1.45; }
    .tag.auth { color: #7e4d10; background: #fdf0d8; }
    .tag.native { color: #125c44; background: #dff3e9; }
    .tag.issue { color: #912d33; background: #fde8e9; }
    nav { display: flex; flex-wrap: wrap; gap: 7px; padding-top: 15px; }
    nav a { background: #fff; border: 1px solid var(--line); padding: 5px 11px; text-decoration: none; border-radius: 7px; }
    nav a:hover { border-color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    section { margin-top: 35px; }
    section > header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    h2 { font-size: 24px; letter-spacing: -.03em; }
    section > header span { color: var(--muted); }
    .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(335px, 100%), 1fr)); gap: 12px; }
    article { display: flex; flex-direction: column; min-width: 0; padding: 13px; border-radius: 11px; border: 1px solid var(--line); background: #fff; scroll-margin-top: 10px; }
    article:target { outline: 2px solid var(--accent); }
    article header { display: flex; flex-wrap: wrap; gap: 5px 8px; align-items: baseline; margin: 0 0 8px; }
    article h3 { font-size: 15px; line-height: 1.35; }
    article header a { text-decoration: none; color: inherit; }
    article p { margin-top: 9px; color: var(--muted); font-size: 12px; }
    article footer { margin-top: auto; padding-top: 7px; color: var(--muted); font-size: 10px; overflow-wrap: anywhere; }
    article figure { margin: 0; }
    article figure img { max-width: 100%; height: auto; }
    .plate { display: grid; place-items: center; padding: 13px; min-height: 220px; overflow: hidden; border-radius: 7px; background: var(--plate); }
    .window { width: min(100%, 370px); color: #25252a; background: #fafafa; border: 1px solid #c6c8cd; border-radius: 9px; box-shadow: 0 4px 11px #2732491b; overflow: hidden; font-size: 11px; line-height: 1.35; }
    .window.narrow { width: min(100%, 258px); }
    .window.mid { width: min(100%, 305px); }
    .window-bar { position: relative; min-height: 26px; display: grid; place-items: center; border-bottom: 1px solid #e1e1e4; background: #f3f3f4; font-weight: 650; }
    .lights { position: absolute; left: 9px; top: 9px; display: flex; gap: 4px; }
    .lights i { display: block; width: 7px; height: 7px; border-radius: 50%; background: #f5655b; }
    .lights i:nth-child(2) { background: #e9b54b; }
    .lights i:nth-child(3) { background: #55bf58; }
    .window-body { padding: 10px; }
    .search { display: flex; justify-content: space-between; align-items: center; gap: 5px; background: #eeeeef; border-radius: 4px; padding: 5px 7px; margin-bottom: 6px; }
    .search.dim { color: #616169; }
    .search.active { box-shadow: 0 0 0 2px #a5caff; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 21px; padding: 3px 5px; border-radius: 4px; }
    .row span:first-child { min-width: 0; overflow-wrap: anywhere; }
    .row small { flex-shrink: 0; color: #5b5b63; font-size: 9px; }
    .row.selected { background: #1973e6; color: #fff; }
    .row.selected small { color: #fff; }
    .row.disabled { color: #74747c; }
    .divider { height: 1px; background: #e1e1e4; margin: 4px 0; }
    .command-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 5px; margin-top: 7px; }
    .command-row.end { justify-content: flex-end; }
    .btn, .value { display: inline-block; border: 1px solid #d0d0d4; background: white; border-radius: 5px; padding: 3px 6px; line-height: 1.2; font-size: 10px; white-space: nowrap; }
    .btn.primary { border-color: #0664d4; color: white; background: #0875ed; }
    .btn.destructive { color: #ad2833; }
    .btn.disabled { background: #f1f1f3; color: #71717c; }
    .value { min-width: 70px; }
    .pane-title { margin-bottom: 4px; font-size: 16px; font-weight: 680; }
    .hint { color: #555964; font-size: 10px; margin: 4px 0; overflow-wrap: anywhere; }
    .hint.error, .error { color: #ad2833; }
    .box { margin-top: 7px; padding: 6px 7px; border: 1px solid #dedee2; border-radius: 5px; }
    .box-title { font-weight: 650; margin-bottom: 2px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 1px 6px; padding: 5px 7px; background: #f4f4f5; border-bottom: 1px solid #e1e1e4; color: #54545c; font-size: 9px; }
    .tabs b { color: #1859a0; }
    .dialog-icon { font-size: 21px; }
    .dialog-title { margin: 2px 0 5px; font-size: 13px; font-weight: 680; }
    .field { width: 100%; padding: 4px 6px; margin-top: 5px; border: 1px solid #d5d6da; border-radius: 4px; background: #fff; overflow-wrap: anywhere; }
    .field.blank { color: #67676e; }
    .file { margin-top: 6px; min-height: 58px; border: 1px solid #dedee1; border-radius: 4px; }
    .split { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); }
    .split > div { min-width: 0; padding: 7px; }
    .split > div + div { border-left: 1px solid #dedee1; }
    .media { display: grid; place-items: center; min-height: 50px; margin: 3px 0 5px; padding: 5px; border-radius: 4px; background: #e5ebf5; color: #315b9c; text-align: center; font-weight: 650; }
    .spot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #5c86bc; margin-right: 3px; }
    .spinner { display: inline-block; width: 11px; height: 11px; border: 2px solid #bac5d4; border-top-color: #2378e1; border-radius: 50%; vertical-align: -2px; }
    .menu-bar { display: flex; align-self: start; justify-content: flex-end; gap: 7px; background: #f5f6fa; color: #262a33; width: 100%; padding: 5px 9px; border: 1px solid #d7dbe4; border-radius: 4px; }
    .terminal { background: #262c38; color: #f4f7ff; padding: 10px; border-radius: 6px; overflow-wrap: anywhere; font: 10px/1.5 "SF Mono", Menlo, monospace; }
    .note { margin-top: 25px; color: var(--muted); }
    @media (max-width: 680px) { .intro { grid-template-columns: 1fr; } .legend { justify-content: flex-start; } }
    @media print { body { background: white; } .layout { padding: 0; } nav { display: none; } article { break-inside: avoid; } .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <main class="layout">
    <header class="intro">
      <div><h1>ClipContext UI 验收画板</h1><p><span id="state-count"></span>。根据 macOS 应用源码重建，示例均为合成数据。</p></div>
      <div class="legend" aria-label="验收图例"><span class="tag">源码重建</span><span class="tag auth">需真实云盘</span><span class="tag native">已验收，范围见备注</span><span class="tag issue">待修</span></div>
    </header>
    <nav id="nav" aria-label="状态分组"></nav>
    <div id="atlas"></div>
    <script id="atlas-data" type="application/json"></script>
    <noscript>请启用 JavaScript 以平铺状态。</noscript>
  </main>
  <script>
    // Each state has a stable anchor. Add native evidence by ID in the map below.
    // Example: "agent-off": { state: "native", note: "验收记录", image: "synthetic-capture.png" }
    const evidence = {
      "agent-off": { state: "native", note: "干净环境确认初始范围关闭。立即同步和 Finder 按钮禁用，未创建归档。" },
      "agent-policy-menu": { state: "native", note: "本机确认菜单含四种范围。" },
      "agent-all-confirm": { state: "native", note: "本机确认弹窗，取消后范围保留关闭。" },
      "agent-all": { state: "native", note: "确认所有历史后，本机归档写入四条合成历史。机密标记条目未被采集。" },
      "agent-manual": { state: "native", note: "右键分享一条合成文本后，自动从关闭切到手动选择，归档仅包含该条。" },
      "agent-pinned": { state: "native", note: "经辅助功能收藏富文本并撤销文本共享后，收藏与手动选择模式只写入富文本。" },
      "agent-share": { state: "native", note: "右键分享一条合成文本，归档内容与原文一致。禁用分享状态按源码重建。" },
      "agent-revoke": { state: "native", note: "共享后出现行标记和撤销共享辅助功能动作。在所有历史模式撤销，行标记消失。" },
      "archive-interval": { state: "native", note: "本机确认四种可选值。选择 1 分钟后移走合成快照，定时任务重建了内容一致的新版本。" },
      "archive-ready": { state: "native", note: "本机归档实际读取并核对过条数和内容，Finder 点击仍待单独确认。" },
      "archive-empty": { state: "native", note: "从收藏与手动选择切换至关闭后，归档写入零条，本机历史仍保留四条。" },
      "icloud-chooser": { state: "native", note: "本机打开系统文件夹选择器并取消，未修改位置。" },
      "icloud-written": { state: "native", note: "隔离路径中的真实 iCloud Drive 文件为 383 字节，内容与合成预期完全一致，系统返回 isUploaded=true。" },
      "drive-blank": { state: "native", note: "本机确认空白表单与授权按钮禁用状态。" },
      "drive-partial": { state: "native", note: "本机确认单个字段已填时授权按钮仍禁用。" },
      "drive-filled": { state: "native", note: "本机确认密钥掩码、两项已填时授权按钮可用，随后取消。" },
      "drive-uploaded": { note: "模拟 Google Drive 网络传输测试已通过。真实账号授权、上传与副本链接待验。" },
      "mcp-actions": { state: "native", note: "已检查 Codex 命令的复制反馈、命令内容和剪贴板临时标记。" },
      "mcp-read": { state: "native", note: "真实 Codex MCP 已读取合成目录。Claude Code 登录已过期，待续验。" },
      "digest-menu": { state: "native", note: "真实 Codex 简报已运行。Claude Code 登录已过期，待续验。" },
      "popup-populated": { state: "native", note: "合成文本、富文本、图片和文件均实际进入历史，机密标记内容被跳过。" },
      "search-hit": { state: "native", note: "本机合成输入得到两条匹配结果。其他匹配模式见源码与测试用例。" },
      "search-empty": { state: "native", note: "本机确认无匹配状态与 Ctrl+U 清空。回车创建按源码重建。" },
      "search-keyboard": { state: "native", note: "本机按方向键向下，依次选中图片和文本。其他快捷键和朗读状态按源码重建。" },
      "preview-file": { state: "native", note: "本机预览显示合成文件的 URL，编辑按钮禁用。" },
      "edit-text": { state: "native", note: "修改合成条目的别名后，完成按钮启用并保存新标题。" },
      "edit-untouched": { state: "native", note: "本机确认编辑器未修改时完成按钮禁用。" },
      "clear-regular": { state: "native", note: "清除确认中选择取消保留所有条目。随后确认清除，仅保留已收藏的富文本。" },
      "prefs-general": { state: "native", note: "本机确认设置窗口六个标签页均可打开。" },
      "prefs-advanced": { state: "native", note: "启用退出时清除历史后退出，磁盘快照已移除未收藏的合成条目，仅保留收藏项。" },
    };
    const text = value => String(value ?? "").replace(/[&<>"']/g, character => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[character]));
    const lights = '<span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>';
    const windowFrame = (title, body, width = "", tabs = "") => `<div class="window ${width}"><div class="window-bar">${lights}${text(title)}</div>${tabs}<div class="window-body">${body}</div></div>`;
    const row = (title, key = "", state = "") => `<div class="row ${state}"><span>${text(title)}</span>${key ? `<small>${text(key)}</small>` : ""}</div>`;
    const button = (title, type = "") => `<span class="btn ${type}">${text(title)}</span>`;
    const commands = (...buttons) => `<div class="command-row end">${buttons.join("")}</div>`;
    const line = '<div class="divider"></div>';
    const hint = (message, error = false) => `<div class="hint${error ? " error" : ""}">${text(message)}</div>`;
    const field = (value, empty = false) => `<div class="field${empty ? " blank" : ""}">${text(value)}</div>`;
    const picker = value => `<span class="value">${text(value)}　⌄</span>`;
    const setting = (title, value) => `<div class="command-row"><span>${text(title)}</span>${value}</div>`;
    const box = (title, contents) => `<div class="box"><div class="box-title">${text(title)}</div>${contents}</div>`;
    const list = (...rows) => rows.map(item => Array.isArray(item) ? row(...item) : row(item)).join("");
    const tabs = (items, active) => `<div class="tabs">${items.map(item => item === active ? `<b>${text(item)}</b>` : `<span>${text(item)}</span>`).join("")}</div>`;
    const sections = ["通用", "存储", "外观", "忽略", "高级", "Agent"];
    const preferences = (active, body) => windowFrame("设置", body, "", tabs(sections, active));
    const agent = body => preferences("Agent", `<div class="pane-title">剪贴板目录</div>${body}`);
    const nativeAlert = (title, message, primary, secondary = "取消", destructive = false) => windowFrame("ClipContext", `<div class="dialog-icon">▤</div><div class="dialog-title">${text(title)}</div>${hint(message)}${commands(secondary ? button(secondary) : "", button(primary, destructive ? "destructive" : "primary"))}`, "mid");
    const find = (value = "", focused = false) => `<div class="search ${value ? "" : "dim"} ${focused ? "active" : ""}"><span>⌕　${text(value || "搜索")}</span>${value ? "<span>⊗</span>" : ""}</div>`;
    const history = (contents, query = "", focus = false) => windowFrame("ClipContext", `${find(query, focus)}${contents}`, "narrow");
    const examples = list(["展会场地核对", "⌘1", "selected"], ["城市采样.png", "图像"], ["行程说明.rtf", "富文本"], ["样例预算.csv", "文件"]);
    const footer = (clear = "清除") => `${line}${list([clear, "⌘⌥⌫"], ["偏好设置…", "⌘,"], "Agent 目录…", "关于", ["退出", "⌘Q"])}`;
    const policy = (name, status = "", minutes = "5 分钟", activity = "") => box("共享范围", `${setting("共享方式", picker(name))}${hint("右键单条历史可分享或撤销。")}${setting("同步间隔", `${picker(minutes)} ${activity === "working" ? '<span class="spinner"></span> ' : ""}${button("立即同步", activity ? "disabled" : "")}`)}${status}`);
    const source = (title, status, ...buttons) => `${setting(title, buttons.join(" "))}${hint(status)}`;
    const drive = (status, ...buttons) => agent(box("同步位置", source("Google Drive", status, ...buttons)));
    const folder = (status, ...buttons) => agent(box("同步位置", source("iCloud Drive", status, ...buttons)));
    const oauth = (client = "", secret = "", mode = "", error = "") => windowFrame("连接 Google Drive", `${hint("启用 Drive API，创建 Desktop app 类型的 OAuth 客户端。")}${hint("打开 Google Cloud OAuth 客户端 ↗")}${field(client || "OAuth 客户端 ID", !client)}${field(secret || "OAuth 客户端密钥", !secret)}${error ? hint(error, true) : ""}${commands(mode === "working" ? '<span class="spinner"></span>' : "", button("取消", mode === "working" ? "disabled" : ""), button("在浏览器中授权", client && secret && mode !== "working" ? "primary" : "disabled"))}`, "mid");
    const preview = (selection, title, content, toolbar = "收藏　 编辑　 删除") => windowFrame("ClipContext", `<div class="split"><div>${find()}${list([selection, "⌘1", "selected"], "展会场地核对")}</div><div><b>${text(title)}</b>${content}${line}${hint(toolbar)}</div></div>`);
    const editor = (alias, pin, content, status, enabled = true, locked = false) => windowFrame("编辑条目", `${setting("别名", button(alias, locked ? "disabled" : ""))}${pin ? setting("快捷键", picker(pin)) : ""}${line}<b>内容</b>${status ? hint(status, true) : ""}${field(content)}${commands(button("取消"), button("完成", enabled ? "primary" : "disabled"))}`, "mid");
    const shelf = (name, content) => preferences("忽略", `${tabs(["应用程序", "剪贴板类型", "正则表达式"], name)}${content}`);
    const toggle = (label, checked) => row(`${checked ? "☑" : "☐"}　${label}`);
    const agentActions = () => box("Agent 接入", `${hint("复制命令到终端注册只读 MCP。")} ${commands(button("复制 Codex 命令"), button("复制 Claude Code 命令"), button("使用说明"))}${commands(button("复制简报命令　⌄"))}`);

    // [anchor, visible title, review detail, implementation, reconstructed frame, optional state]
    const groups = [
      ["agent-scope", "Agent · 共享范围", "默认关闭，按范围发布剪贴板目录", [
        ["agent-off", "关闭 · 初始状态", "从浮窗的 Agent 目录…或设置里的 Agent 页进入。首次启动且无归档时，立即同步禁用，悬停显示原因。", "Settings/ArchiveSettingsPane.swift:27", agent(policy("关闭", "", "5 分钟", "off"))],
        ["agent-policy-menu", "共享方式 · 四个选项", "检查关闭、手动选择、收藏与手动选择、所有历史。", "Settings/ArchiveSettingsPane.swift:29", agent(policy("关闭", "", "5 分钟", "off") + list(["关闭", "✓", "selected"], "手动选择", "收藏与手动选择", "所有历史"))],
        ["agent-manual", "手动选择", "右键分享首条历史可从关闭自动进入此模式。确认只出现手动选入的条目。", "ClipboardArchive.swift:212", agent(policy("手动选择", hint("已写入 1 条 · 09:42")))],
        ["agent-pinned", "收藏与手动选择", "已收藏和手动分享都会进入目录。对已收藏条目撤销共享后，它仍保留收藏。", "ClipboardArchive.swift:228", agent(policy("收藏与手动选择", hint("已写入 3 条 · 09:42")))],
        ["agent-all-confirm", "所有历史 · 授权确认", "取消应恢复原有选项。允许后，现有及后续符合条件的历史按该模式同步到已连接位置。", "Settings/ArchiveSettingsPane.swift:129", nativeAlert("允许 Agent 读取所有历史？", "本机现有和后续采集的历史会自动进入共享目录。已连接的云盘也会收到这份目录。", "允许所有历史")],
        ["agent-all", "所有历史 · 已允许", "右键仍可排除单条，忽略规则仍生效。关闭共享后应在可用目的地同步空目录。", "ClipboardArchive.swift:228", agent(policy("所有历史", hint("已写入 6 条 · 09:42")))],

        ["prefs-ignore-regex", "忽略 · 正则表达式", "新增、编辑和移除规则。使用合成匹配项核对历史采集和 Agent 分享行为。", "Settings/IgnoreSettingsPane/IgnoreRegexpsSettingsView.swift:15", shelf("正则表达式", `<div class="file">${list(["^合成私密样例", "", "selected"])}</div>${commands(button("+"), button("−"))}`)],
        ["prefs-advanced", "高级 · 暂停与退出清理", "检查关闭采集、退出时清除历史和清除系统剪贴板。可用合成数据核对全局效果。", "Settings/AdvancedSettingsPane.swift:7", preferences("高级", toggle("关闭采集", false) + hint("可通过菜单栏临时停止采集。") + line + toggle("退出时清除历史", false) + toggle("清除系统剪贴板", false))],
      ]],
    ];

    const names = { source: "源码重建", auth: "需真实云盘", native: "验收见备注", issue: "待修" };
    const renderState = ([id, title, detail, file, illustration, state = "source"]) => {
      const proof = evidence[id];
      const marker = proof?.state || state;
      return `<article id="${text(id)}"><header><h3><a href="#${text(id)}">${text(title)}</a></h3><span class="tag ${text(marker)}">${text(names[marker])}</span></header><figure class="plate" aria-label="${text(title)}示意">${illustration}</figure><p>${text(detail)}</p>${proof?.image ? `<figure><img src="${text(proof.image)}" alt="${text(title)}本机截图" loading="lazy"></figure>` : ""}${proof?.note ? `<p>${text(proof.note)}</p>` : ""}<footer>${text(file)}</footer></article>`;
    };
    const count = groups.reduce((sum, group) => sum + group[3].length, 0);
    document.getElementById("atlas-data").textContent = JSON.stringify(groups.map(([id, title, description, states]) => ({
      id, title, description,
      states: states.map(([id, title, detail, file, illustrationHTML, state = "source"]) => ({
        id, title, detail, file, illustrationHTML, state, evidence: evidence[id] ?? null,
      })),
    })));
    document.getElementById("state-count").textContent = `${groups.length} 组，${count} 个状态`;
    document.getElementById("nav").innerHTML = groups.map(([id, title]) => `<a href="#${text(id)}">${text(title)}</a>`).join("");
    document.getElementById("atlas").innerHTML = groups.map(([id, title, description, states]) => `<section id="${text(id)}" aria-labelledby="${text(id)}-title"><header><h2 id="${text(id)}-title">${text(title)}</h2><span>${text(description)}</span></header><div class="board">${states.map(renderState).join("")}</div></section>`).join("");
  </script>
</body>
