<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>记忆 · Context</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <svg class="glyphs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-memory" viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5-8 4.5zM4 12l8 4.5 8-4.5M4 16.5l8 4.5 8-4.5"/></symbol>
    <symbol id="i-raw" viewBox="0 0 24 24"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.25"/><path d="m15 15 4.5 4.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-extract" viewBox="0 0 24 24"><path d="M5 5h14M7.5 9h9M10.5 13h3M12 13v7m-3-3 3 3 3-3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="m9 15 6-6m-5 7-2 2a4 4 0 0 1-5.6-5.6l4-4a4 4 0 0 1 5.6 0m0 7.2a4 4 0 0 0 5.6 0l4-4A4 4 0 0 0 16 6l-2 2"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 1-5L16.5 3.5a1.8 1.8 0 0 1 2.5 0l1.5 1.5a1.8 1.8 0 0 1 0 2.5L9 19zM14 6l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16m-11 0V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 9a7.5 7.5 0 1 0 .1 6M19 4v5h-5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="9" r="4"/><path d="m11 12 8 8m-3-3 2-2m.5 4.5 2-2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
  </svg>
  <div class="shell">
    <aside class="rail">
      <div class="brand"><span class="seal" aria-hidden="true"><i></i><i></i><i></i></span><strong>Context</strong></div>
      <div class="workspace-name">上下文工作台</div>
      <nav class="navigation" aria-label="资料库"><button type="button" data-tab="memory" aria-current="page"><svg><use href="#i-memory"></use></svg>记忆</button><button type="button" data-tab="raw"><svg><use href="#i-raw"></use></svg>原始记录</button></nav>
      <a id="vault-entry" class="vault-entry" href="http://127.0.0.1:8743/" target="_blank" rel="noopener noreferrer" hidden>私密资料 Vault ↗</a>
      <button type="button" id="connection" class="connection" aria-label="服务连接设置"><span class="dot"></span><span id="connection-label">正在连接</span><svg><use href="#i-key"></use></svg></button>
    </aside>
    <main>
      <header class="page-head">
        <div><h1 id="page-title">记忆</h1><p id="page-description">查看、整理并回溯已保存的记忆。</p></div>
        <div class="actions"><button type="button" id="extract" class="button"><svg><use href="#i-extract"></use></svg>提取记忆</button><button type="button" id="create" class="button primary"><svg><use href="#i-plus"></use></svg><span id="create-label">新建记忆</span></button></div>
      </header>
      <p id="notice" class="notice" role="status" hidden></p>
      <section class="panel" aria-label="浏览记录">
        <div class="toolbar"><label class="search"><svg aria-hidden="true"><use href="#i-search"></use></svg><input id="search" type="search" aria-label="搜索记忆" placeholder="搜索记忆" autocomplete="off"><kbd aria-hidden="true">/</kbd></label><button id="refresh" class="icon-button" type="button" title="刷新" aria-label="刷新"><svg><use href="#i-refresh"></use></svg></button></div>
        <div id="workspace"></div>
      </section>
    </main>
  </div>
  <dialog id="editor" aria-labelledby="editor-title"><form id="editor-form">
    <header class="dialog-head"><h2 id="editor-title"></h2><button type="button" class="icon-button" data-close="editor" aria-label="关闭"><svg><use href="#i-close"></use></svg></button></header>
    <div id="editor-fields" class="fields"></div>
    <div id="editor-error" class="form-error" role="alert" hidden></div>
    <footer class="dialog-actions"><button type="button" class="button" data-close="editor">取消</button><button type="submit" class="button primary" id="save">保存</button></footer>
  </form></dialog>
  <dialog id="access" aria-labelledby="access-title"><form id="access-form">
    <header class="dialog-head"><h2 id="access-title">连接服务</h2><button type="button" class="icon-button" data-close="access" aria-label="关闭"><svg><use href="#i-close"></use></svg></button></header>
    <div class="fields"><label class="field">访问令牌<input type="password" id="token" placeholder="输入服务所有者提供的管理令牌" autocomplete="off" required></label><p class="hint">本机可使用 <code>context-hub open</code> 打开已授权的工作台。令牌仅保存在当前标签页。</p></div>
    <div id="access-error" class="form-error" role="alert" hidden></div>
    <footer class="dialog-actions"><button type="button" id="disconnect" class="button subdued">断开连接</button><button type="submit" class="button primary" id="connect">连接</button></footer>
  </form></dialog>
  <dialog id="confirm-delete" aria-labelledby="delete-title"><form id="delete-form">
    <header class="dialog-head"><h2 id="delete-title">删除记录？</h2></header>
    <div class="fields"><p id="delete-description"></p></div><div id="delete-error" class="form-error" role="alert" hidden></div>
    <footer class="dialog-actions"><button type="button" class="button" data-close="confirm-delete" autofocus>取消</button><button type="submit" id="remove" class="button danger">确认删除</button></footer>
  </form></dialog>
</body>
</html>
