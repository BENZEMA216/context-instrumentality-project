name: "Bug / 隐私问题"
description: "缺陷，或脱敏 / 过滤失效"
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: "问题与复现步骤"
      description: "请用合成数据复现，不要粘贴真实录音、剪切板或密钥。"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: "环境"
  - type: input
    id: linear
    attributes:
      label: "已有的 Linear 工单（可选）"
      placeholder: "REC-… 或工单链接"
