name: Context Vault

on:
  push:
    paths:
      - 'vault/**'
      - 'hub/**'
      - 'schema/**'
      - 'pyproject.toml'
      - '.github/workflows/context-vault.yml'
  pull_request:
    paths:
      - 'vault/**'
      - 'hub/**'
      - 'schema/**'
      - 'pyproject.toml'
      - '.github/workflows/context-vault.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Vault, Hub, and container lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Hub and Vault with their integrations
        run: python -m pip install '.[agent,test]' './vault[agent,test,gmail]'
      - name: Test Vault and Hub
        run: python -m pytest -q tests vault/tests
      - name: Verify the owner import, search, and lock in Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python vault/ci/browser_smoke.py
      - name: Build standalone Vault image
        run: docker build -t context-vault:ci vault
      - name: Recover a locked Vault after replacing its container
        run: bash vault/ci/container-lifecycle.sh context-vault:ci

  ios:
    name: iOS simulator build and encrypted transfer
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the app and its UI tests for iOS Simulator
        run: |
          xcodebuild -quiet build-for-testing \
            -project vault/ios/ContextVaultCapture.xcodeproj \
            -scheme ContextVaultCapture \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/context-vault-ios" \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the Swift sender against the Python receiver
        run: |
          python -m pip install ./vault
          python vault/ios/Tests/verify_transfer.py
