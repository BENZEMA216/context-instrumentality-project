name: Add Issues and PRs to GitHub Project

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

jobs:
  add-to-project:
    name: Add item to Open Context Project Board
    runs-on: ubuntu-latest
    # 仅在仓库已配置 vars.PROJECT_URL 时执行，避免 Fork/未配置报错
    if: vars.PROJECT_URL != ''
    steps:
      - name: Add item to Project V2
        uses: actions/add-to-project@v1
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.ADD_TO_PROJECT_TOKEN }}
