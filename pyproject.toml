[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-context-hub"
version = "0.1.0"
description = "Personal context evidence, derived memories, and agent tools"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
agent = ["mcp>=1.29,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
context-hub = "hub.__main__:main"
context-hub-mcp = "hub.agent:main"
context-hub-history-export = "hub.history_exports:main"
context-hub-history = "hub.history:main"
context-hub-import = "hub.imports:main"

[tool.setuptools]
packages = ["hub"]

[tool.setuptools.package-data]
hub = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.setuptools.data-files]
"share/context-instrumentality-project" = ["schema/context-event.schema.json", "channels/audio/record-for-agent/AgentBridge/library.py"]
