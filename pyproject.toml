[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "context-instrumentality"
version = "0.3.0"
description = "Raw Memory — Local-first personal raw data & evidence-gated AI agent memory engine (L0-L4, MCP, Agent-as-Curator, multi-channel collectors, Vault for Agent, and Meta Benchmarks)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.10,<3",
    "jsonschema>=4.23,<5",
    "pyyaml>=6.0,<7",
    "mcp>=1.9,<2",
    "cryptography>=44,<47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.28,<1",
    "ruff>=0.9,<1",
]
audio = [
    "sherpa-onnx>=1.10,<3",
    "numpy>=1.26,<3",
]

[project.scripts]
raw-memory = "context_hub.cli:main"
raw-memory-eval = "context_eval.cli:main"
raw-collectors = "context_collectors.cli:main"
raw-vault = "context_vault.cli:main"
context-hub = "context_hub.cli:main"
context-collectors = "context_collectors.cli:main"
context-eval = "context_eval.cli:main"
context-vault = "context_vault.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/hub/src/context_hub",
    "packages/collectors/src/context_collectors",
    "packages/vault/src/context_vault",
    "packages/eval/src/context_eval",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "channels",
    "web",
    "extensions",
    "native",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["context_hub", "context_collectors", "context_vault", "context_eval"]
